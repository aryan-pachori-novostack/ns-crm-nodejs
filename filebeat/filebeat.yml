# filebeat/filebeat.yml

name: "crm-service"

logging.metrics.enabled: false
xpack.security.enabled: false
xpack.monitoring.enabled: false
setup.ilm.enabled: false
setup.template.enabled: false

filebeat.inputs:
  - type: filestream
    paths:
      - /logs/error/*.log
      - /logs/warn/*.log
      - /logs/info/*.log
    parsers:
      - ndjson:
          overwrite_keys: true
          add_error_key: true
          expand_keys: true

processors:
  - add_host_metadata: ~
  #- add_cloud_metadata: ~
  - add_docker_metadata: ~
  - add_kubernetes_metadata: ~

output.logstash:
  hosts: ["13.234.222.44:5044"]
  ssl.enabled: true
  ssl.certificate_authorities: ["/usr/share/filebeat/ca.crt"]
